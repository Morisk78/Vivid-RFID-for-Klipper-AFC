#####################################################################
# GEMEINSAME PROMPT-LOGIK
#####################################################################

[gcode_macro RFID_PROFILE_PICKER]
description: RFID Profil-Auswahl für Reader 0 oder 1
gcode:
   {% set reader = params.READER|default(0)|int %}

   RESPOND TYPE=command MSG="action:prompt_begin RFID Profil Reader { reader }"
   RESPOND TYPE=command MSG="action:prompt_text Wähle ein Profil für Reader {{ reader }}"

   RESPOND TYPE=command MSG="action:prompt_button ABS Neon Yellow|RFID_WRITE_PROFILE READER={ reader } PROFILE=ABS_NEON_YELLOW|primary"
   RESPOND TYPE=command MSG="action:prompt_button ABS Light Grey|RFID_WRITE_PROFILE READER={ reader } PROFILE=ABS_LIGHT_GREY|primary"
   RESPOND TYPE=command MSG="action:prompt_button ABS Neon Green|RFID_WRITE_PROFILE READER={ reader } PROFILE=ABS_NEON_GREEN|primary"

   RESPOND TYPE=command MSG="action:prompt_footer_button Abbrechen|RESPOND TYPE=command MSG=action:prompt_end|warning"
   RESPOND TYPE=command MSG="action:prompt_show"


#####################################################################
# PROMPT-WRAPPER FÜR PROMPT=
#####################################################################

[gcode_macro RFID_PROFILE_PICKER_DEV0]
gcode:
   RFID_PROFILE_PICKER READER=0

[gcode_macro RFID_PROFILE_PICKER_DEV1]
gcode:
   RFID_PROFILE_PICKER READER=1


#####################################################################
# ALIGN + PICK
#####################################################################

[gcode_macro RFID_ALIGN_AND_PICK]
description: RFID suchen, lesen und Profilauswahl
gcode:
    {% set lane = params.LANE|default(1)|int %}

    {% if lane == 1 %}
        MMS_RFID_ALIGN_AND_READ NAME=mfrc522_0 LANE=lane1 STEP=20 WAIT=0.5 MAX_SEARCH=600 PROMPT=RFID_PROFILE_PICKER_DEV0
    {% elif lane == 2 %}
        MMS_RFID_ALIGN_AND_READ NAME=mfrc522_0 LANE=lane2 STEP=20 WAIT=0.5 MAX_SEARCH=600 PROMPT=RFID_PROFILE_PICKER_DEV0
    {% elif lane == 3 %}
        MMS_RFID_ALIGN_AND_READ NAME=mfrc522_1 LANE=lane3 STEP=20 WAIT=0.5 MAX_SEARCH=600 PROMPT=RFID_PROFILE_PICKER_DEV1
    {% elif lane == 4 %}
        MMS_RFID_ALIGN_AND_READ NAME=mfrc522_1 LANE=lane4 STEP=20 WAIT=0.5 MAX_SEARCH=600 PROMPT=RFID_PROFILE_PICKER_DEV1
    {% else %}
        RESPOND MSG="RFID: ungültige Lane, nur 1 bis 4"
    {% endif %}


