#####################################################################
# VIVID RFID MACROS
#####################################################################

############################
# READER 0 / READER 1 BASIS
############################

[gcode_macro MMS_RFID_DETECT_DEV0]
gcode:
   MMS_RFID_DETECT_DEV NAME=mfrc522_0 SWITCH=1

[gcode_macro MMS_RFID_WRITE_DEV0]
gcode:
   MMS_RFID_WRITE_DEV NAME=mfrc522_0

[gcode_macro MMS_RFID_READ_DEV0]
gcode:
   MMS_RFID_READ_DEV NAME=mfrc522_0 SWITCH=1

[gcode_macro MMS_RFID_STOP_DEV0]
gcode:
   MMS_RFID_DETECT_DEV NAME=mfrc522_0 SWITCH=0
   MMS_RFID_READ_DEV NAME=mfrc522_0 SWITCH=0


[gcode_macro MMS_RFID_DETECT_DEV1]
gcode:
   MMS_RFID_DETECT_DEV NAME=mfrc522_1 SWITCH=1

[gcode_macro MMS_RFID_WRITE_DEV1]
gcode:
   MMS_RFID_WRITE_DEV NAME=mfrc522_1

[gcode_macro MMS_RFID_READ_DEV1]
gcode:
   MMS_RFID_READ_DEV NAME=mfrc522_1 SWITCH=1

[gcode_macro MMS_RFID_STOP_DEV1]
gcode:
   MMS_RFID_DETECT_DEV NAME=mfrc522_1 SWITCH=0
   MMS_RFID_READ_DEV NAME=mfrc522_1 SWITCH=0


#####################################################################
# GEMEINSAME PROFIL-SCHREIBLOGIK
#####################################################################

[gcode_macro RFID_WRITE_PROFILE]
description: Schreibt ausgewähltes RFID Profil auf Reader 0 oder 1
gcode:
   {% set reader = params.READER|default(0)|int %}
   {% set profile = params.PROFILE|string %}

   RESPOND TYPE=command MSG="action:prompt_end"

   {% if profile == "ABS_NEON_YELLOW" %}
      RUN_SHELL_COMMAND CMD=RFID_LOAD_PROFILE_ABS_NEON_YELLOW
   {% elif profile == "ABS_NEON_GREEN" %}
      RUN_SHELL_COMMAND CMD=RFID_LOAD_PROFILE_ABS_NEON_GREEN
   {% elif profile == "ABS_LIGHT_GREY" %}
      RUN_SHELL_COMMAND CMD=RFID_LOAD_PROFILE_ABS_LIGHT_GREY
   {% else %}
      RESPOND MSG="RFID: unbekanntes Profil { profile }"
   {% endif %}

   G4 P1000
   RESPOND MSG="RFID: schreibe Tag auf Reader { reader }"

   {% if reader == 0 %}
      MMS_RFID_WRITE_DEV NAME=mfrc522_0
   {% elif reader == 1 %}
      MMS_RFID_WRITE_DEV NAME=mfrc522_1
   {% else %}
      RESPOND MSG="RFID: ungültiger Reader { reader }"
   {% endif %}


#####################################################################
# KOMPATIBILITÄTS-MAKROS READER 0
#####################################################################

[gcode_macro RFID_WRITE_ABS_NEON_YELLOW_DEV0]
gcode:
   RFID_WRITE_PROFILE READER=0 PROFILE=ABS_NEON_YELLOW

[gcode_macro RFID_WRITE_ABS_NEON_GREEN_DEV0]
gcode:
   RFID_WRITE_PROFILE READER=0 PROFILE=ABS_NEON_GREEN

[gcode_macro RFID_WRITE_ABS_LIGHT_GREY_DEV0]
gcode:
   RFID_WRITE_PROFILE READER=0 PROFILE=ABS_LIGHT_GREY

